[package]
name = "xero-mech"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "xero-mech"
path = "src/main.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"
